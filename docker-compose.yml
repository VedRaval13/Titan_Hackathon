version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: titans
      POSTGRES_PASSWORD: titans
      POSTGRES_DB: titans_db
    ports: 
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    networks: 
      - titans-net
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U titans"]
      interval: 10s
      timeout: 5s
      retries: 5

  titans-backend:
    build: ./backend
    ports: 
      - "8000:8000"
    env_file: ./backend/.env
    depends_on: 
      postgres:
        condition: service_healthy
    networks: 
      - titans-net
    environment:
      DATABASE_URL: postgresql+asyncpg://titans:titans@postgres:5432/titans_db

  titans-frontend:
    build: ./frontend
    ports: 
      - "80:80"
    depends_on: 
      - titans-backend
    networks: 
      - titans-net

volumes:
  postgres_data:

networks:
  titans-net:
    driver: bridge
